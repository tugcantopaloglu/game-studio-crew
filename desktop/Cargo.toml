[package]
name = "game-studio-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "game-studio"
path = "src/main.rs"

[dependencies]
studio-core = { path = "../crates/studio-core" }
tao = "0.35"
wry = "0.55"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
