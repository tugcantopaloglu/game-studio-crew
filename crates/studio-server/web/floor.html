<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio Floor</title>
<style>
  :root {
    --bg: #08090d;
    --panel: #0d1015;
    --panel-2: #11151c;
    --field: #0a0d12;
    --line: rgba(148,163,184,.09);
    --line-2: rgba(148,163,184,.17);
    --text: #e4e8f0;
    --dim: #8a93a4;
    --faint: #545d6d;
    --running: #4ad991;
    --warn: #e0bc55;
    --error: #e2636d;
    --info: #6fa8d1;
    --glass: rgba(11,13,18,.72);
    --shadow: 0 10px 30px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.35);
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 12.5px/1.55 var(--sans);
    display: grid; grid-template-columns: 1fr 344px; overflow: hidden; }
  ::selection { background: rgba(74,217,145,.25); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.16); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,.28); }

  #stage { position: relative; overflow: hidden; }
  #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 38%, transparent 55%, rgba(0,0,0,.42));
    z-index: 2; }
  canvas { display: block; cursor: grab; }
  canvas.grabbing { cursor: grabbing; }

  .sec { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    color: var(--faint); }

  #side { border-left: 1px solid var(--line-2); min-height: 0; overflow-y: auto;
    background: linear-gradient(180deg, var(--panel-2), var(--panel) 140px);
    display: flex; flex-direction: column; }
  header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    background: linear-gradient(90deg, #f0f4fb, #97a2b6); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  #conn { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--dim); padding: 3px 9px 3px 7px; border: 1px solid var(--line-2); border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  #conn::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  #conn.live { color: var(--running); border-color: rgba(74,217,145,.3); }
  #conn.live::before { background: var(--running); box-shadow: 0 0 6px var(--running);
    animation: pulse 2.2s ease-in-out infinite; }
  #conn.down { color: var(--error); border-color: rgba(226,99,109,.3); }
  #conn.down::before { background: var(--error); }
  @keyframes pulse { 50% { opacity: .45; } }

  #stats { padding: 12px 16px; border-bottom: 1px solid var(--line);
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #stats .sec { grid-column: 1 / -1; margin-bottom: 2px; }
  .stat { display: flex; flex-direction: column; gap: 1px; padding: 7px 10px 6px;
    background: var(--field); border: 1px solid var(--line); border-radius: 8px; }
  .stat span { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--faint); order: 2; }
  .stat b { font: 600 14px/1.2 var(--mono); font-variant-numeric: tabular-nums; order: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #feed-head { padding: 10px 16px 6px; }
  #feed { overflow-y: auto; padding: 0 6px 6px; min-height: 120px; flex: 1; }
  .ev { padding: 2.5px 10px; margin: 0 0 1px; border-radius: 6px;
    display: grid; grid-template-columns: 34px 1fr; gap: 9px; align-items: baseline;
    font-family: var(--mono); font-size: 11.5px; }
  .ev:hover { background: rgba(148,163,184,.07); }
  .ev .seq { color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; font-size: 10.5px; }
  .ev .t { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev.terminal .t { color: var(--text); font-weight: 600; }
  .ev.bad .t { color: var(--error); }

  #compose { padding: 12px 16px; border-top: 1px solid var(--line); display: grid; gap: 7px; }
  #compose select, #compose textarea, #compose button, #compose input[type=text] {
    font: inherit; font-size: 12.5px; background: var(--field); color: var(--text);
    border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 10px;
    transition: border-color .15s, box-shadow .15s, background .15s; }
  #compose select:hover, #compose input[type=text]:hover, #compose textarea:hover { border-color: rgba(148,163,184,.3); }
  #compose select:focus, #compose textarea:focus, #compose input[type=text]:focus { outline: none;
    border-color: rgba(74,217,145,.55); box-shadow: 0 0 0 3px rgba(74,217,145,.12); }
  #compose ::placeholder { color: var(--faint); }
  #project-form { display: grid; gap: 7px; padding: 10px; border: 1px solid var(--line-2);
    border-radius: 10px; background: var(--panel-2); }
  #project-form input[type=text] { width: 100%; }
  #np-git-wrap { display: flex; align-items: center; gap: 6px; color: var(--dim);
    font-size: 11.5px; padding: 0 4px; }
  #np-git-wrap input { accent-color: var(--running); }
  #project.none { border-color: rgba(226,99,109,.5); }
  #compose textarea { resize: vertical; min-height: 52px; font-family: var(--sans); }
  #compose button, #ask button, #scrub button, #detail button { cursor: pointer;
    background: linear-gradient(180deg, #1b212c, #151a23); border: 1px solid var(--line-2);
    color: var(--text); font-weight: 600; }
  #compose button:hover, #ask button:hover, #scrub button:hover, #detail button:hover {
    background: linear-gradient(180deg, #222a37, #1a202b); border-color: rgba(148,163,184,.3); }
  #compose button:active { transform: translateY(1px); }
  #send { background: linear-gradient(180deg, #3fce88, #2aa96b) !important;
    border-color: rgba(74,217,145,.5) !important; color: #04170d !important;
    font-weight: 700; letter-spacing: .02em; }
  #send:hover { background: linear-gradient(180deg, #52dd97, #31b876) !important;
    box-shadow: 0 2px 12px rgba(74,217,145,.25); }
  #compose .row { display: grid; grid-template-columns: 1fr auto; gap: 7px; }
  #sent { color: var(--dim); font-size: 11.5px; min-height: 15px; }

  #ask { padding: 13px 16px; border-top: 1px solid rgba(224,188,85,.35);
    background: linear-gradient(180deg, rgba(224,188,85,.10), rgba(224,188,85,.03)); }
  #ask h2 { margin: 0 0 5px; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--warn); display: flex; align-items: center; gap: 7px; }
  #ask h2::before { content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: pulse 1.6s ease-in-out infinite; }
  #ask p { margin: 0 0 10px; font-size: 12.5px; color: var(--text); }
  #ask .row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  #ask button { font: inherit; border-radius: 8px; padding: 6px 8px; }
  #ask-yes { border-color: rgba(224,188,85,.45) !important; color: var(--warn) !important; }
  #ask-no { border-color: rgba(226,99,109,.4) !important; color: var(--error) !important; }

  #tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-top: 1px solid var(--line); }
  #tabs button { flex: 1; cursor: pointer; font: 600 10.5px var(--sans); letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint); background: transparent; padding: 6px 4px;
    border: 1px solid transparent; border-bottom: 1px solid var(--line-2); border-radius: 7px 7px 0 0; }
  #tabs button:hover { color: var(--dim); background: rgba(148,163,184,.05); }
  #tabs button.on { color: var(--text); background: var(--field);
    border-color: var(--line-2); border-bottom-color: transparent; }

  .panel { padding: 12px 16px; display: grid; gap: 8px; }
  .panel .sec { margin-bottom: 2px; }
  .panel .hint { color: var(--faint); font-size: 11.5px; }
  .panel .row { display: grid; grid-template-columns: 1fr auto; gap: 7px; align-items: center; }
  .panel .field { display: grid; gap: 3px; }
  .panel label { color: var(--dim); font-size: 11.5px; }
  .panel select, .panel input[type=text], .panel input[type=number], .panel textarea, .panel button {
    font: inherit; font-size: 12.5px; background: var(--field); color: var(--text);
    border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 9px; }
  .panel textarea { resize: vertical; min-height: 46px; font-family: var(--sans); }
  .panel button { cursor: pointer; font-weight: 600;
    background: linear-gradient(180deg, #1b212c, #151a23); }
  .panel button:hover { background: linear-gradient(180deg, #222a37, #1a202b); }
  .panel button:disabled { opacity: .5; cursor: default; }
  .panel input[type=checkbox] { accent-color: var(--running); }
  .panel .check { display: flex; align-items: center; gap: 7px; color: var(--dim); font-size: 11.5px; }
  .panel .card { border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel-2);
    padding: 9px 11px; display: grid; gap: 5px; }
  .panel .card b { font-size: 12.5px; }
  .panel .card .k { color: var(--faint); font: 10.5px var(--mono); }
  .panel .ok { color: var(--running); }
  .panel .bad { color: var(--error); }
  .panel .warn { color: var(--warn); }

  #help { padding: 9px 16px 11px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11px; }
  kbd { background: rgba(148,163,184,.12); border: 1px solid var(--line-2); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 5px; color: var(--dim); font: 600 10.5px var(--mono); }

  .overlay { background: var(--glass); backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); }

  #detail { position: absolute; right: 14px; top: 14px; width: 262px; display: none;
    padding: 13px 14px; font-size: 12.5px; z-index: 6; }
  #detail h2 { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  #detail .k { color: var(--dim); }
  #detail .row { display: flex; justify-content: space-between; gap: 8px; padding: 1.5px 0; }
  #detail .row span:last-child { font-family: var(--mono); font-size: 11.5px; }
  #detail .sum { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--dim); }
  #detail button { margin-top: 11px; width: 100%; font: 600 12px var(--sans);
    border-radius: 8px; padding: 6px; }

  #tip { position: absolute; pointer-events: none; max-width: 290px; display: none;
    padding: 9px 12px; font-size: 12px; z-index: 5; }
  #tip b { display: block; margin-bottom: 3px; font-size: 12.5px; }
  #tip .s { color: var(--dim); font-size: 11.5px; }

  #track { position: absolute; left: 14px; bottom: 14px; right: 196px; display: none;
    padding: 10px 14px; z-index: 4; }
  #track .name { color: var(--dim); font-size: 10.5px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; margin-bottom: 8px; }
  #track .lane { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line-2);
    background: rgba(148,163,184,.06); color: var(--dim); font: 500 11px var(--mono); }
  .chip.active { border-color: rgba(74,217,145,.6); color: var(--running);
    background: rgba(74,217,145,.10); box-shadow: 0 0 10px rgba(74,217,145,.15); }
  .chip.done { color: var(--text); background: rgba(148,163,184,.10); }
  .chip.skipped { opacity: .38; text-decoration: line-through; }
  .gate { font: 600 10.5px var(--mono); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-2); }
  .gate.pass { color: var(--running); border-color: rgba(74,217,145,.35); background: rgba(74,217,145,.07); }
  .gate.fail { color: var(--error); border-color: rgba(226,99,109,.4); background: rgba(226,99,109,.08); }
  .arrow { color: var(--faint); }

  #minimap { position: absolute; right: 14px; bottom: 14px; z-index: 4; padding: 7px;
    background: var(--glass); backdrop-filter: blur(14px);
    border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); }

  #scrub { position: absolute; left: 14px; top: 52px; z-index: 4; display: flex; align-items: center;
    gap: 10px; padding: 7px 12px; }
  #scrub input { width: 190px; accent-color: var(--running); }
  #scrub .lbl { color: var(--dim); font: 600 10.5px var(--mono); min-width: 74px;
    letter-spacing: .06em; text-transform: uppercase; }
  #scrub button { font: 600 10.5px var(--sans); letter-spacing: .06em; text-transform: uppercase;
    border-radius: 6px; padding: 3px 9px; }

  #cam { position: absolute; left: 14px; top: 14px; color: var(--dim);
    font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase;
    padding: 5px 10px; z-index: 4; }

  #lowspec { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 9px 11px 9px 14px; z-index: 7;
    border-color: rgba(224,188,85,.4); max-width: calc(100% - 28px); }
  #lowspec .txt { display: flex; flex-direction: column; min-width: 0; }
  #lowspec b { font-size: 12.5px; letter-spacing: .03em; }
  #lowspec span { color: var(--dim); font-size: 11.5px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #lowspec button { cursor: pointer; font: 600 11.5px var(--sans); border-radius: 8px;
    padding: 6px 11px; border: 1px solid var(--line-2); color: var(--text);
    background: linear-gradient(180deg, #1b212c, #151a23); white-space: nowrap; }
  #lowspec button:hover { background: linear-gradient(180deg, #222a37, #1a202b); }
  #lowspec-yes { border-color: rgba(224,188,85,.45) !important; color: var(--warn) !important; }

  #done { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px;
    z-index: 7; border-color: rgba(74,217,145,.4);
    box-shadow: var(--shadow), 0 0 30px rgba(74,217,145,.14);
    animation: drop .35s cubic-bezier(.2,.9,.3,1.2); }
  #done.bad { border-color: rgba(226,99,109,.45);
    box-shadow: var(--shadow), 0 0 30px rgba(226,99,109,.14); }
  @keyframes drop { from { transform: translate(-50%, -26px); opacity: 0; } }
  #done .badge { width: 30px; height: 30px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-size: 15px; font-weight: 700;
    background: rgba(74,217,145,.15); color: var(--running);
    border: 1px solid rgba(74,217,145,.4); }
  #done.bad .badge { background: rgba(226,99,109,.15); color: var(--error);
    border-color: rgba(226,99,109,.45); }
  #done .txt { display: flex; flex-direction: column; min-width: 0; max-width: 380px; }
  #done .txt b { font-size: 12.5px; letter-spacing: .04em; }
  #done .txt span { color: var(--dim); font-size: 11.5px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #done button { font: 600 12px var(--sans); cursor: pointer; border-radius: 8px;
    padding: 7px 14px; border: 1px solid var(--line-2); color: var(--text);
    background: linear-gradient(180deg, #1b212c, #151a23); }
  #done button:hover { background: linear-gradient(180deg, #222a37, #1a202b); }
  #done-play { background: linear-gradient(180deg, #3fce88, #2aa96b) !important;
    border-color: rgba(74,217,145,.5) !important; color: #04170d !important;
    font-weight: 700 !important; letter-spacing: .03em; }
  #done-play:hover { background: linear-gradient(180deg, #52dd97, #31b876) !important;
    box-shadow: 0 2px 12px rgba(74,217,145,.3); }
  #done-play:disabled { opacity: .5; cursor: default; }
  #done-x { padding: 7px 10px !important; color: var(--dim) !important; }
  #done-fix { display: none; border-color: rgba(224,188,85,.45) !important; color: var(--warn) !important; }
  #done-revert { display: none; border-color: rgba(226,99,109,.4) !important; color: var(--error) !important; }

  #shot { position: absolute; right: 14px; bottom: 132px; width: 216px; display: none;
    padding: 6px 6px 4px; z-index: 4; cursor: pointer; }
  #shot img { width: 100%; border-radius: 8px; display: block; }
  #shot .cap { font-size: 9.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--faint); padding: 4px 3px 1px; }

  #detail .think { margin-top: 9px; padding: 7px 9px; border-radius: 8px;
    background: rgba(111,168,209,.07); border: 1px solid rgba(111,168,209,.22); }
  #detail .think .lbl2 { font-size: 9.5px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--info); margin-bottom: 3px; }
  #detail .think .ln2 { font-size: 12px; color: var(--text); }

  #detail .act { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line); }
  #detail .act .lbl2 { font-size: 9.5px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--faint); margin-bottom: 4px; }
  #detail .act .ln { font: 11px var(--mono); color: var(--dim); display: flex; gap: 8px;
    padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #detail .act .ln .sq { color: var(--faint); font-variant-numeric: tabular-nums; min-width: 30px; text-align: right; }
  #detail .act .ln.err { color: var(--error); }

  #room { position: absolute; left: 14px; top: 100px; width: 306px; display: none;
    padding: 12px 14px 11px; z-index: 5; max-height: calc(100% - 200px);
    display: none; flex-direction: column; border-color: rgba(111,168,209,.34);
    box-shadow: var(--shadow), 0 0 26px rgba(111,168,209,.12); }
  #room.on { display: flex; }
  #room .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  #room .kind { font: 700 9.5px var(--mono); letter-spacing: .16em; text-transform: uppercase;
    color: var(--info); }
  #room .chair { font: 600 10.5px var(--mono); color: var(--faint); white-space: nowrap; }
  #room .topic { margin: 6px 0 9px; font-size: 12.5px; color: var(--text); }
  #room .said { overflow-y: auto; display: grid; gap: 8px; padding-right: 2px; }
  #room .pos { display: grid; gap: 2px; padding-left: 9px;
    border-left: 2px solid rgba(148,163,184,.2); }
  #room .pos.chair { border-left-color: rgba(111,168,209,.6); }
  #room .pos .r { font: 700 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint); }
  #room .pos.chair .r { color: var(--info); }
  #room .pos .p { font-size: 12px; color: var(--dim); }
  #room .ruling { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line-2);
    display: grid; gap: 4px; }
  #room .ruling .lbl2 { font: 700 9.5px var(--mono); letter-spacing: .14em; text-transform: uppercase;
    color: var(--running); }
  #room .ruling .claim { font-size: 12.5px; font-weight: 600; color: var(--text); }
  #room .ruling .why { font-size: 11.5px; color: var(--dim); }
  #room .ruling .over { font-size: 11px; color: var(--faint); }
  #room .ruling .path { font: 10.5px var(--mono); color: var(--faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: 44vh minmax(0, 1fr); }
    #side { border-left: none; border-top: 1px solid var(--line-2); }
    #track { right: 14px; }
    #scrub { right: 14px; }
    #scrub input { width: auto; flex: 1; min-width: 70px; }
    #minimap, #shot { display: none !important; }
    #done { max-width: calc(100% - 28px); flex-wrap: wrap; }
    #room { right: 14px; width: auto; top: 92px; max-height: calc(100% - 150px); }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="tip" class="overlay"></div><div id="cam" class="overlay">isometric</div><div id="detail" class="overlay"></div>
  <div id="scrub" class="overlay"><span class="lbl">live</span><input id="seek" type="range" min="0" max="0" value="0"><button id="tolive">latest</button></div>
  <div id="track" class="overlay"><div class="name"></div><div class="lane"></div></div>
  <div id="room" class="overlay">
    <div class="hd"><span class="kind"></span><span class="chair"></span></div>
    <div class="topic"></div>
    <div class="said"></div>
    <div class="ruling" hidden>
      <div class="lbl2">decision</div>
      <div class="claim"></div>
      <div class="why"></div>
      <div class="over"></div>
      <div class="path"></div>
    </div>
  </div>
  <div id="done" class="overlay" hidden>
    <div class="badge">&#10003;</div>
    <div class="txt"><b id="done-title">build complete</b><span id="done-sub"></span></div>
    <button id="done-play">&#9654; play</button>
    <button id="done-fix">fix defects</button>
    <button id="done-revert">revert run</button>
    <button id="done-x" title="dismiss">&#10005;</button>
  </div>
  <div id="shot" class="overlay" title="open full size"><img alt=""><div class="cap">latest shot</div></div>
  <canvas id="minimap" width="150" height="98"></canvas>
</div>
<div id="side">

<script type="module">
import * as THREE from "/vendor/three.module.js";
import { buildOffice, wanderStep, avatarPose, refreshScreens, paintScreens, setMotion, seatAtTable, leaveTable, showBoard, boardSays, boardDecided, hideBoard } from "/scene.js";
import { pushEvent, setProject, onProject, setStage, settings } from "/bus.js";
import { startChatter, chatterSays } from "/chatter.js";
import { budget, reducedMotion, sampleFrame, hardwareHints, shouldOfferLowSpec, noteOffered, reasonForOffer, onTier } from "/perf.js";

const RING = { idle: 0x2f3644, running: 0x4ad991, blocked: 0xd9c24a, meeting: 0x6fa8d1, error: 0xd95555 };
const TERMINAL = new Set(["run_ended","meeting_ended","workflow_ended","decision_recorded","escalated","verify_result","budget_exhausted"]);
const BAD = new Set(["escalated","budget_exhausted","inconclusive_flagged"]);

const stage = document.getElementById("stage");
const tip = document.getElementById("tip");
const camLabel = document.getElementById("cam");

let tier = budget();
let motionOn = !reducedMotion();
setMotion(motionOn);

const renderer = new THREE.WebGLRenderer({ antialias: tier.pixelRatio > 1 });
renderer.setPixelRatio(Math.min(devicePixelRatio, tier.pixelRatio));
renderer.shadowMap.enabled = tier.shadows;
renderer.shadowMap.type = tier.softShadows ? THREE.PCFSoftShadowMap : THREE.BasicShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08090d);
scene.fog = new THREE.Fog(0x08090d, 70, 190);

const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 400);
const orbit = { theta: Math.PI * 0.25, phi: Math.PI * 0.30, dist: 44, target: new THREE.Vector3(0, 0.5, 0) };
let freeCam = false;

const ambientLight = new THREE.AmbientLight(0x8fa0bc, tier.ambient);
scene.add(ambientLight);
const sky = new THREE.HemisphereLight(0xb8ccf0, 0x14181f, tier.hemisphere);
scene.add(sky);
const key = new THREE.DirectionalLight(0xfff2dc, 2.0);
key.position.set(18, 30, 14);
key.castShadow = tier.shadows;
key.shadow.mapSize.set(tier.shadowMap, tier.shadowMap);
key.shadow.camera.near = 1; key.shadow.camera.far = 110;
const S = 30;
key.shadow.camera.left = -S; key.shadow.camera.right = S;
key.shadow.camera.top = S; key.shadow.camera.bottom = -S;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.03;
scene.add(key);

function fitShadowToFloor(f) {
  const pad = 3;
  const half = Math.max(f.width, f.height) / 2 + pad;
  key.shadow.camera.left = -half; key.shadow.camera.right = half;
  key.shadow.camera.top = half; key.shadow.camera.bottom = -half;
  key.shadow.camera.updateProjectionMatrix();
}
const fill = new THREE.DirectionalLight(0x4a6494, 0.45);
fill.position.set(-16, 12, -18);
scene.add(fill);

let avatars = new Map();
let ambient = [];
let meetingTable = null;
let following = null;
let selected = null;
const meetings = new Map();
const allEvents = [];
let scrubbing = false;
let workflow = null;
const state = new Map();
let stats = { events: 0, tokens: 0, spend: 0, cacheRead: 0, cacheWrite: 0, symbols: 0, run: "-", history: [], feed: [] };
let screensDirty = true;
let lastScreenPaint = 0;
let lastMini = 0;
let miniDirty = true;
let statsDirty = true;
let trackDirty = true;
let detailDirty = false;
const feedQueue = [];
const MAX_HISTORY = 20000;
let droppedBefore = 0;

function screenData() {
  const crewByDept = {};
  for (const [role, a] of avatars) {
    (crewByDept[a.dept] ||= []).push({
      role,
      tokens: deskState(role).tokens,
      color: "#" + (RING[deskState(role).ring] || RING.idle).toString(16).padStart(6, "0"),
    });
  }
  const tot = stats.cacheRead + stats.cacheWrite;
  return {
    run: stats.run, events: stats.events, tokens: stats.tokens, spend: stats.spend,
    cacheRead: stats.cacheRead, cacheWrite: stats.cacheWrite,
    cacheHit: tot ? (stats.cacheRead / tot) * 100 : null,
    history: stats.history, feed: stats.feed, crewByDept,
  };
}

function deskState(role) {
  if (!state.has(role)) {
    state.set(role, { ring: "idle", summary: "", tool: "", tokens: 0, log: [], thought: "", thoughtPhase: "" });
  }
  return state.get(role);
}

function logActivity(st, seq, text, err) {
  st.log.push({ seq, text, err: !!err });
  if (st.log.length > 9) st.log.shift();
}

const roomEl = document.getElementById("room");
let room = null;

function renderRoom() {
  if (!room) { roomEl.classList.remove("on"); return; }
  roomEl.classList.add("on");
  roomEl.querySelector(".kind").textContent = room.kind || "meeting";
  roomEl.querySelector(".chair").textContent = room.chair ? "chair " + room.chair : "";
  roomEl.querySelector(".topic").textContent = room.topic || "";

  roomEl.querySelector(".said").innerHTML = room.said.length
    ? room.said
        .map((p) =>
          `<div class="pos${p.seat === "chair" ? " chair" : ""}">` +
          `<div class="r">${esc(p.role)}</div><div class="p">${esc(p.position)}</div></div>`
        )
        .join("")
    : `<div class="pos"><div class="p">waiting for the first position</div></div>`;

  const ruling = roomEl.querySelector(".ruling");

  if (room.decision) {

    ruling.querySelector(".why").textContent = d.rationale || "";
    ruling.querySelector(".over").textContent = (d.dissent || []).length
      ? "overrules " + d.dissent.join("; ")
      : "";
    ruling.querySelector(".path").textContent = d.path || "";
  }
}

function updateCamera() {
  const t = orbit.target;
  camera.position.set(
    t.x + orbit.dist * Math.sin(orbit.phi) * Math.cos(orbit.theta),
    t.y + orbit.dist * Math.cos(orbit.phi),
    t.z + orbit.dist * Math.sin(orbit.phi) * Math.sin(orbit.theta)
  );
  camera.lookAt(t);
}

const UP = new THREE.Vector3(0, 1, 0);
const GROUND = new THREE.Plane(UP, 0);
const panRay = new THREE.Raycaster();
const panNdc = new THREE.Vector2();
let anchor = null;

function groundAt(e) {
  const r = renderer.domElement.getBoundingClientRect();
  panNdc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  panNdc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  panRay.setFromCamera(panNdc, camera);
  const hit = new THREE.Vector3();
  return panRay.ray.intersectPlane(GROUND, hit) ? hit : null;
}
const el = renderer.domElement;
let dragging = false, dragged = false, lastX = 0, lastY = 0;

el.addEventListener("contextmenu", (e) => e.preventDefault());
el.addEventListener("pointerdown", (e) => {
  dragging = true; dragged = false; lastX = e.clientX; lastY = e.clientY;
  anchor = groundAt(e);
  el.classList.add("grabbing");
  el.setPointerCapture(e.pointerId);
});
el.addEventListener("pointerup", (e) => {
  dragging = false; anchor = null; el.classList.remove("grabbing");
  el.releasePointerCapture(e.pointerId);
});
el.addEventListener("pointermove", (e) => {
  if (!dragging) { hoverTest(e); return; }
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (Math.abs(dx) + Math.abs(dy) > 2) dragged = true;
  lastX = e.clientX; lastY = e.clientY;

  const rotating = freeCam && !e.shiftKey;
  if (rotating) {
    orbit.theta -= dx * 0.005;
    orbit.phi = Math.max(0.10, Math.min(Math.PI / 2 - 0.03, orbit.phi - dy * 0.004));
    updateCamera();
    return;
  }

  const now = groundAt(e);
  if (anchor && now) {
    orbit.target.x += anchor.x - now.x;
    orbit.target.z += anchor.z - now.z;
    updateCamera();
  }
});
el.addEventListener("wheel", (e) => {
  e.preventDefault();
  orbit.dist = Math.max(7, Math.min(110, orbit.dist * (1 + Math.sign(e.deltaY) * 0.12)));
  updateCamera();
}, { passive: false });

addEventListener("keydown", (e) => {
  if (e.key !== "o" && e.key !== "O") return;
  freeCam = !freeCam;
  camLabel.textContent = freeCam ? "orbit  (drag rotates, shift+drag pans)" : "isometric";
  if (!freeCam) { orbit.theta = Math.PI * 0.25; orbit.phi = Math.PI * 0.28; updateCamera(); }
});

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const hitList = [];
const hitRoles = new Map();
const hits = [];

function rebuildHitList() {
  hitList.length = 0;
  hitRoles.clear();
  for (const [role, a] of avatars) {
    hitList.push(a.hit);
    hitRoles.set(a.hit, role);
  }
}

function pickAgent(e) {
  if (!hitList.length) return null;
  const r = el.getBoundingClientRect();
  ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  hits.length = 0;
  ray.intersectObjects(hitList, false, hits);
  return hits.length ? hitRoles.get(hits[0].object) : null;
}

const detail = document.getElementById("detail");

function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function showDetail(role) {
  selected = role;
  if (!role) { detail.style.display = "none"; return; }
  const a = avatars.get(role), st = deskState(role);
  if (st.thought && (!thought || thought.role !== role)) {
    thought = { role, text: st.thought, phase: st.thoughtPhase || "thinking", at: clock.getElapsedTime() };
  }
  detail.innerHTML =
    `<h2>${esc(a.title)}</h2>` +
    `<div class="row"><span class="k">role</span><span>${esc(role)}</span></div>` +
    `<div class="row"><span class="k">tier</span><span>${esc(a.tier)}</span></div>` +
    `<div class="row"><span class="k">dept</span><span>${esc(a.dept)}</span></div>` +
    `<div class="row"><span class="k">state</span><span>${esc(st.ring)}</span></div>` +
    `<div class="row"><span class="k">tokens</span><span>${esc(st.tokens.toLocaleString())}</span></div>` +
    (st.tool ? `<div class="row"><span class="k">tool</span><span>${esc(st.tool)}</span></div>` : "") +
    (st.thought
      ? `<div class="think"><div class="lbl2">${esc(st.thoughtPhase === "speaking" ? "saying" : "thinking")}</div>` +
        `<div class="ln2">${esc(st.thought)}</div></div>`
      : "") +
    (st.summary ? `<div class="sum">${esc(st.summary)}</div>` : `<div class="sum k">no capsule yet</div>`) +
    (st.log.length
      ? `<div class="act"><div class="lbl2">activity</div>` +
        st.log
          .map((l) => `<div class="ln${l.err ? " err" : ""}"><span class="sq">${esc(l.seq)}</span><span>${esc(l.text)}</span></div>`)
          .join("") +
        `</div>`
      : "") +
    `<button id="unfollow">${following === role ? "stop following" : "follow"}</button>`;
  detail.style.display = "block";
  document.getElementById("unfollow").onclick = () => {
    following = following === role ? null : role;
    showDetail(role);
  };
}

el.addEventListener("click", (e) => {
  if (dragged) return;
  const role = pickAgent(e);
  following = role;
  showDetail(role);
});

addEventListener("keydown", (e) => {
  if (e.key === "Escape") { following = null; showDetail(null); }
});

let hovered = null;
let hoveredKey = "";

function hoverTest(e) {
  const r = el.getBoundingClientRect();
  const best = pickAgent(e);
  if (!best) {
    if (hovered) { tip.style.display = "none"; hovered = null; hoveredKey = ""; }
    return;
  }

  const a = avatars.get(best), st = deskState(best);
  const key = best + "|" + st.ring + "|" + st.tool + "|" + st.tokens + "|" + st.summary;
  if (key !== hoveredKey) {
    hoveredKey = key;
    tip.innerHTML =
      `<b>${esc(a.title)}</b><div class="s">tier ${esc(a.tier)} &middot; ${esc(a.dept)} &middot; ${esc(st.ring)}</div>` +
      (st.tool ? `<div class="s">tool: ${esc(st.tool)}</div>` : "") +
      (st.tokens ? `<div class="s">${esc(st.tokens.toLocaleString())} tokens</div>` : "") +
      (st.summary ? `<div>${esc(st.summary)}</div>` : "");
  }
  hovered = best;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 300) + "px";
  tip.style.top = (e.clientY - r.top + 14) + "px";
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  updateCamera();
}
addEventListener("resize", resize);

const hints = hardwareHints(renderer);
let offerBox = null;

function dismissOffer() {
  noteOffered();
  if (offerBox) { offerBox.remove(); offerBox = null; }
}

function offerLowSpec() {
  if (offerBox) return;
  offerBox = document.createElement("div");
  offerBox.id = "lowspec";
  offerBox.className = "overlay";
  offerBox.innerHTML =
    `<div class="txt"><b>this machine is struggling</b><span>${esc(reasonForOffer(hints))}</span></div>` +
    `<button id="lowspec-yes">use low spec</button><button id="lowspec-no">keep it</button>`;
  stage.appendChild(offerBox);
  document.getElementById("lowspec-yes").onclick = () => {
    settings.set("lowSpec", true);
    settings.save();
    dismissOffer();
  };
  document.getElementById("lowspec-no").onclick = dismissOffer;
}

function countSceneLights() {
  let n = 0;
  scene.traverse((o) => { if (o.isPointLight || o.isSpotLight) n++; });
  return n;
}

onTier((b) => {
  tier = b;
  renderer.setPixelRatio(Math.min(devicePixelRatio, b.pixelRatio));
  renderer.shadowMap.enabled = b.shadows;
  renderer.shadowMap.type = b.softShadows ? THREE.PCFSoftShadowMap : THREE.BasicShadowMap;
  key.castShadow = b.shadows;
  key.shadow.mapSize.set(b.shadowMap, b.shadowMap);
  if (key.shadow.map) { key.shadow.map.dispose(); key.shadow.map = null; }

  ambientLight.intensity = b.ambient;
  sky.intensity = b.hemisphere;

  const wantLights = b.roomLights || b.deskLights;
  scene.traverse((o) => { if (o.isPointLight || o.isSpotLight) o.visible = wantLights; });
  if (wantLights && !countSceneLights()) {
    sent.textContent = "reload the floor to bring the room lighting back";
  }
  screensDirty = true;
  miniDirty = true;
  resize();
});

if (typeof matchMedia === "function") {
  const calm = matchMedia("(prefers-reduced-motion: reduce)");
  const followMotion = () => { motionOn = !calm.matches; setMotion(motionOn); };
  if (calm.addEventListener) calm.addEventListener("change", followMotion);
}

const BUBBLE_W = 512, BUBBLE_H = 176;
const bubbleCanvas = document.createElement("canvas");
bubbleCanvas.width = BUBBLE_W;
bubbleCanvas.height = BUBBLE_H;
const bubbleCtx = bubbleCanvas.getContext("2d");
const bubbleTex = new THREE.CanvasTexture(bubbleCanvas);
bubbleTex.colorSpace = THREE.SRGBColorSpace;
const bubbleMat = new THREE.MeshBasicMaterial({
  map: bubbleTex, transparent: true, depthWrite: false, depthTest: false, fog: false, opacity: 0,
});
const bubble = new THREE.Mesh(new THREE.PlaneGeometry(2.05, 2.05 * (BUBBLE_H / BUBBLE_W)), bubbleMat);
bubble.renderOrder = 20;
bubble.visible = false;
scene.add(bubble);

let thought = null;
let thoughtDrawn = "";

function focusRole() {
  return following || selected;
}

function roundRect(x, px, py, w, h, r) {
  x.beginPath();
  x.moveTo(px + r, py);
  x.arcTo(px + w, py, px + w, py + h, r);
  x.arcTo(px + w, py + h, px, py + h, r);
  x.arcTo(px, py + h, px, py, r);
  x.arcTo(px, py, px + w, py, r);
  x.closePath();
}

function drawBubble(text, phase) {
  const x = bubbleCtx;
  x.clearRect(0, 0, BUBBLE_W, BUBBLE_H);
  const accent = phase === "thinking" ? "#8ea9d8" : phase === "done" ? "#5d6675" : "#4ad991";

  roundRect(x, 6, 6, BUBBLE_W - 12, BUBBLE_H - 40, 18);
  x.fillStyle = "rgba(10,13,18,.93)";
  x.fill();
  x.strokeStyle = "rgba(148,163,184,.34)";
  x.lineWidth = 2;
  x.stroke();

  x.beginPath();
  x.moveTo(BUBBLE_W / 2 - 16, BUBBLE_H - 34);
  x.lineTo(BUBBLE_W / 2, BUBBLE_H - 8);
  x.lineTo(BUBBLE_W / 2 + 14, BUBBLE_H - 34);
  x.closePath();
  x.fillStyle = "rgba(10,13,18,.93)";
  x.fill();

  x.fillStyle = accent;
  x.font = "700 15px ui-monospace, monospace";
  x.fillText(phase === "speaking" ? "SAYING" : phase.toUpperCase(), 22, 32);

  x.fillStyle = "#dfe4ee";
  x.font = "500 21px ui-monospace, monospace";
  let line = "", y = 62;
  for (const w of String(text || "").split(/\s+/)) {
    if (!w) continue;
    const next = line ? line + " " + w : w;
    if (x.measureText(next).width > BUBBLE_W - 48 && line) {
      x.fillText(line, 22, y);
      y += 26;
      line = w;
      if (y > BUBBLE_H - 46) { line = ""; break; }
    } else {
      line = next;
    }
  }
  if (line) x.fillText(line, 22, y);
  bubbleTex.needsUpdate = true;
}

function noteThought(role, text, phase) {
  const st = deskState(role);
  st.thought = phase === "done" && !text ? st.thought : text;
  st.thoughtPhase = phase;
  if (!settings.get("thoughts.enabled") || role !== focusRole()) return;
  thought = { role, text: st.thought, phase, at: clock.getElapsedTime() };
}

function stepBubble(dt, t) {
  const live =
    thought &&
    settings.get("thoughts.enabled") &&
    thought.role === focusRole() &&
    avatars.has(thought.role) &&
    t - thought.at < (thought.phase === "done" ? 2.2 : 6.5);

  const want = live ? 1 : 0;
  bubbleMat.opacity += (want - bubbleMat.opacity) * Math.min(1, dt * 6);
  bubble.visible = bubbleMat.opacity > 0.02;
  if (!bubble.visible || !thought) return;

  const key = thought.phase + " " + thought.text;
  if (key !== thoughtDrawn) {
    drawBubble(thought.text, thought.phase);
    thoughtDrawn = key;
  }
  const p = avatars.get(thought.role).person.position;
  bubble.position.set(p.x, p.y + 2.82, p.z);
  bubble.quaternion.copy(camera.quaternion);
}

const clock = new THREE.Clock();

function rigStep(a, cam) {
  if (tier.farRigPeriod <= 0) return 0;
  return a.person.position.distanceTo(cam) > tier.farRigDistance ? tier.farRigPeriod : 0;
}

function ringOpacity(ring, stuck, t, seed) {
  if (!motionOn) return ring === "idle" ? 0.35 : stuck ? 0.95 : 0.8;
  if (stuck) return 0.55 + Math.sin(t * 7 + seed) * 0.45;
  return ring === "idle" ? 0.28 : 0.7 + Math.sin(t * 4 + seed) * 0.3;
}

function flushDom() {
  if (feedQueue.length) drainFeed();
  if (statsDirty) { renderStats(); statsDirty = false; }
  if (trackDirty) { renderTrack(); trackDirty = false; }
  if (detailDirty) { if (selected) showDetail(selected); detailDirty = false; }
}

function animate() {
  requestAnimationFrame(animate);
  const began = performance.now();
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();
  const cam = camera.position;

  for (const [role, a] of avatars) {
    const st = deskState(role);
    const stuck = st.ring === "error" || st.ring === "blocked";
    const busy = st.ring === "running" || st.ring === "meeting" || stuck;
    wanderStep(a, busy, dt, t);
    a.rig.update(avatarPose(a, st.ring, t), dt, t, rigStep(a, cam));

    a.ringMat.opacity = ringOpacity(st.ring, stuck, t, a.seed);
    if (a.alarm) {
      a.alarm.intensity = !stuck ? 0 : motionOn ? 2.6 + Math.sin(t * 7 + a.seed) * 2.0 : 3.0;
    }

    const lit = st.ring === "running" || st.ring === "meeting";
    if (a.lamp) {
      a.lamp.visible = lit || stuck;
      if (a.lamp.visible) {
        const tint = stuck ? RING.error : RING[st.ring];
        a.bulb.material.color.setHex(tint);
        a.cone.material.color.setHex(tint);
        a.pool.material.color.setHex(tint);
        const w = motionOn ? 0.5 + Math.sin(t * (stuck ? 7 : 3.4) + a.seed) * 0.5 : 0.5;
        a.bulb.material.opacity = 0.6 + w * 0.4;
        a.bulb.scale.setScalar(1 + w * 0.2);
        a.cone.material.opacity = 0.11 + w * 0.10;
        a.pool.material.opacity = 0.14 + w * 0.12;
        if (a.spot) {
          a.spot.color.setHex(tint);
          a.spot.intensity = 22 + w * 22;
        }
      } else if (a.spot) {
        a.spot.intensity = 0;
      }
    }
  }

  for (const a of ambient) {
    wanderStep(a, false, dt, t);
    a.rig.update(avatarPose(a, "idle", t), dt, t, rigStep(a, cam));
  }
  stepBubble(dt, t);

  if (miniDirty && t - lastMini > tier.minimapPeriod) {
    renderMinimap();
    miniDirty = false;
    lastMini = t;
  }

  if (screensDirty && t - lastScreenPaint > tier.screenPeriod) {
    refreshScreens(screenData());
    screensDirty = false;
    lastScreenPaint = t;
  }
  paintScreens(tier.screensPerFrame);
  flushDom();

  if (following && avatars.has(following)) {
    const p = avatars.get(following).person.position;
    orbit.target.x += (p.x - orbit.target.x) * 0.08;
    orbit.target.z += (p.z - orbit.target.z) * 0.08;
    updateCamera();
  }

  renderer.render(scene, camera);
  sampleFrame(performance.now() - began);
  if (shouldOfferLowSpec()) offerLowSpec();
}

function setRing(role, name) {
  const a = avatars.get(role);
  if (!a) return;
  const st = deskState(role);
  if (st.ring === name) return;
  st.ring = name;
  a.ringMat.color.setHex(RING[name] || RING.idle);
  miniDirty = true;
}

const roleOf = (actor) => (actor || "").split("#")[0];

function resetState() {
  for (const [role, a] of avatars) {
    state.set(role, { ring: "idle", summary: "", tool: "", tokens: 0, log: [], thought: "", thoughtPhase: "" });
    a.ringMat.color.setHex(RING.idle);
    if (a.meetingSeat) leaveTable(a);
  }
  meetings.clear();
  thought = null;
  hideBoard();
  room = null;
  renderRoom();
  workflow = null;
  stats = { events: 0, tokens: 0, spend: 0, cacheRead: 0, cacheWrite: 0, symbols: 0, run: stats.run, history: [], feed: [] };
}

function rebuildTo(seq) {
  resetState();
  for (const ev of allEvents) {
    if (ev.seq > seq) break;
    apply(ev, true);
  }
  renderStats();
  renderTrack();
  refreshScreens(screenData());
  paintScreens(Infinity);
  miniDirty = true;
}

function apply(ev, replaying) {
  const role = roleOf(ev.actor);
  const known = avatars.has(role);
  const st = known ? deskState(role) : null;

  switch (ev.type) {
    case "run_started": stats.run = ev.run; break;
    case "worker_spawned":
      if (known) { setRing(role, "running"); st.summary = ""; logActivity(st, ev.seq, "spawned"); }
      break;
    case "worker_state_changed":
      if (known) {
        const to = ev.data.to;
        setRing(role,
          to === "reaped" || to === "refused" ? "idle" :
          to === "stalled" || to === "timed_out" ? "error" :
          to === "rate_limited" ? "blocked" : "running");
      }
      break;
    case "worker_exited": if (known) setRing(role, ev.data.outcome === "completed" ? "idle" : "error"); break;
    case "tool_call":
      if (st) { st.tool = ev.data.tool || ""; logActivity(st, ev.seq, "→ " + (ev.data.tool || "tool")); }
      break;
    case "tool_result":
      if (st) logActivity(st, ev.seq, (ev.data.ok ? "✓ " : "✗ ") + (ev.data.bytes || 0) + "b", !ev.data.ok);
      break;
    case "meeting_started": {
      const ids = (ev.data.participants || []).filter((r) => avatars.has(r));
      meetings.set(ev.data.meeting_id, ids);
      showBoard(ev.data.kind, ev.data.topic, ev.data.participants, ev.data.chair);
      room = {
        id: ev.data.meeting_id,
        kind: ev.data.kind,
        topic: ev.data.topic,
        chair: ev.data.chair,
        said: [],
        decision: null,
      };
      renderRoom();
      ids.forEach((r, i) => {
        setRing(r, "meeting");
        if (meetingTable) seatAtTable(avatars.get(r), meetingTable, i, ids.length);
      });
      break;
    }
    case "meeting_spoke": {
      if (room && room.id === ev.data.meeting_id) {
        room.said.push({
          role: ev.data.role,
          seat: ev.data.seat,
          position: ev.data.position,
        });
        renderRoom();
      }
      if (ev.data.seat !== "chair") boardSays(ev.data.role, ev.data.position);
      if (!replaying && ev.data.role) chatterSays(ev.data.role);
      if (st) logActivity(st, ev.seq, "spoke: " + String(ev.data.position || "").slice(0, 40));
      break;
    }
    case "decision_recorded": {
      if (room) {
        room.decision = {
          claim: ev.data.claim,
          rationale: ev.data.rationale,
          dissent: ev.data.dissent || [],
          path: ev.data.path,
        };
        renderRoom();
      }
      if (ev.data.claim) boardDecided(ev.data.claim);
      break;
    }
    case "meeting_ended": {
      const ids = meetings.get(ev.data.meeting_id) || [];
      ids.forEach((r) => {
        setRing(r, "idle");
        leaveTable(avatars.get(r));
      });
      meetings.delete(ev.data.meeting_id);
      if (!meetings.size && !(room && room.decision)) hideBoard();
      break;
    }
    case "agent_thought": {
      const who = ev.data.role && avatars.has(ev.data.role) ? ev.data.role : role;
      if (avatars.has(who)) noteThought(who, ev.data.text || "", ev.data.phase || "thinking");
      break;
    }
    case "escalated": if (known) setRing(role, "blocked"); break;
    case "capsule_submitted":
      if (st) { st.summary = ev.data.summary || st.summary; logActivity(st, ev.seq, "capsule submitted"); }
      break;
    case "verify_result": if (known) setRing(role, ev.data.verdict === "pass" ? "running" : "error"); break;
    case "workflow_started":
      workflow = { id: ev.data.workflow, title: ev.data.title || ev.data.workflow,
                   nodes: ev.data.nodes || [], entered: [], skipped: [], gates: {}, done: false,
                   baseSha: ev.data.base_sha || null, commits: 0 };
      break;
    case "commit_recorded":
      if (workflow && !workflow.done) workflow.commits++;
      break;
    case "node_entered":
      if (workflow) {
        if (ev.data.skipped) workflow.skipped.push(ev.data.node);
        else workflow.entered.push(ev.data.node);
      }
      break;
    case "gate_evaluated":
      if (workflow) workflow.gates[ev.data.gate] = ev.data.passed;
      break;
    case "workflow_ended":
      if (workflow) { workflow.done = true; workflow.outcome = ev.data.outcome; }
      if (!replaying) showDone(ev.data.outcome);
      break;
    case "index_updated":
      stats.symbols = Math.max(0, stats.symbols + (ev.data.symbols_delta || 0));
      break;
    case "budget_approval_needed":
      if (!replaying) showApproval(ev.data);
      break;
    case "token_usage": {
      const d = ev.data;
      stats.tokens += (d.input || 0) + (d.output || 0);
      stats.spend += d.cost_usd || 0;
      stats.cacheRead += d.cache_read || 0;
      stats.cacheWrite += d.cache_creation || 0;
      if (st) st.tokens += (d.input || 0) + (d.output || 0);
      break;
    }
  }
  if (!replaying) {
    allEvents.push(ev);
    if (allEvents.length > MAX_HISTORY) {
      droppedBefore = allEvents[allEvents.length - MAX_HISTORY].seq;
      allEvents.splice(0, allEvents.length - MAX_HISTORY);
      seek.min = String(droppedBefore);
    }
  }
  stats.events++;
  stats.history.push(Math.min(1, ((ev.data && ev.data.output) || 8) / 120));
  if (stats.history.length > 26) stats.history.shift();
  stats.feed.push({ seq: ev.seq, type: ev.type, bad: BAD.has(ev.type) });
  if (stats.feed.length > 12) stats.feed.shift();
  if (!replaying) {
    statsDirty = true;
    trackDirty = true;
    if (selected && selected === role) detailDirty = true;
  }
  screensDirty = true;
}

const trackEl = document.getElementById("track");
function renderTrack() {
  if (!workflow) { trackEl.style.display = "none"; return; }
  trackEl.style.display = "block";
  trackEl.querySelector(".name").textContent =
    workflow.title + (workflow.done ? "  \u00b7  " + workflow.outcome : "  \u00b7  running");

  const parts = [];
  workflow.nodes.forEach((n, i) => {
    if (i) parts.push('<span class="arrow">&rsaquo;</span>');
    const cls = workflow.skipped.includes(n) ? "skipped"
      : workflow.entered.includes(n) ? (workflow.entered[workflow.entered.length - 1] === n && !workflow.done ? "active" : "done")
      : "";
    parts.push('<span class="chip ' + cls + '">' + esc(n) + "</span>");
    if (n in workflow.gates) {
      const ok = workflow.gates[n];
      parts.push('<span class="gate ' + (ok ? "pass" : "fail") + '">' + (ok ? "gate pass" : "gate fail") + "</span>");
    }
  });
  trackEl.querySelector(".lane").innerHTML = parts.join(" ");
}

const mini = document.getElementById("minimap");
const mctx = mini.getContext("2d");
let miniFloor = null;
function renderMinimap() {
  if (!miniFloor) return;
  const sx = mini.width / miniFloor.width, sy = mini.height / miniFloor.height;
  mctx.clearRect(0, 0, mini.width, mini.height);
  for (const r of miniFloor.rooms.concat([miniFloor.lobby])) {
    mctx.fillStyle = r.department === "lobby" ? "rgba(148,163,184,.16)" : "rgba(148,163,184,.09)";
    mctx.fillRect(r.x * sx, r.y * sy, r.w * sx, r.h * sy);
    mctx.strokeStyle = "rgba(148,163,184,.22)";
    mctx.strokeRect(r.x * sx, r.y * sy, r.w * sx, r.h * sy);
  }
  for (const d of miniFloor.desks) {
    const st = deskState(d.role);
    mctx.fillStyle = "#" + (RING[st.ring] || RING.idle).toString(16).padStart(6, "0");
    mctx.fillRect(d.x * sx - 1, d.y * sy - 1, Math.max(3, d.w * sx), Math.max(3, d.h * sy));
  }
}

function renderStats() {
  document.getElementById("s-run").textContent = stats.run;
  document.getElementById("s-events").textContent = stats.events.toLocaleString();
  document.getElementById("s-tokens").textContent = stats.tokens.toLocaleString();
  document.getElementById("s-spend").textContent = "$" + stats.spend.toFixed(4);
  const tot = stats.cacheRead + stats.cacheWrite;
  document.getElementById("s-cache").textContent = tot ? ((stats.cacheRead / tot) * 100).toFixed(0) + "%" : "-";
  document.getElementById("s-symbols").textContent = stats.symbols ? stats.symbols.toLocaleString() : "-";
}

const feed = document.getElementById("feed");
function logEvent(ev) {
  feedQueue.push(ev);
  if (feedQueue.length > 400) feedQueue.shift();
}

function drainFeed() {
  const pinned = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 26;
  const batch = document.createDocumentFragment();
  for (const ev of feedQueue) {
    const row = document.createElement("div");
    row.className = "ev" + (TERMINAL.has(ev.type) ? " terminal" : "") + (BAD.has(ev.type) ? " bad" : "");
    const who = ev.actor === "daemon" ? "" : " " + roleOf(ev.actor);
    row.innerHTML = `<span class="seq">${esc(ev.seq)}</span><span class="t">${esc(ev.type)}${esc(who)}</span>`;
    batch.appendChild(row);
  }
  feedQueue.length = 0;
  feed.appendChild(batch);
  while (feed.childElementCount > 400) feed.removeChild(feed.firstChild);
  if (pinned) feed.scrollTop = feed.scrollHeight;
}

const conn = document.getElementById("conn");
let lastSeq = 0;
function connect() {
  const run = new URLSearchParams(location.search).get("run");
  const url = new URL("/ws", location.href);
  url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
  if (run) url.searchParams.set("run", run);
  url.searchParams.set("since_seq", String(lastSeq));
  const ws = new WebSocket(url);
  ws.onopen = () => { conn.textContent = "live"; conn.className = "live"; };
  ws.onclose = () => { conn.textContent = "reconnecting"; conn.className = "down"; setTimeout(connect, 1000); };
  ws.onmessage = (m) => {
    let ev; try { ev = JSON.parse(m.data); } catch { return; }
    if (typeof ev.seq === "number") lastSeq = Math.max(lastSeq, ev.seq);
    pushEvent(ev);
    if (scrubbing) { allEvents.push(ev); seek.max = String(lastSeq); return; }
    apply(ev); logEvent(ev);
    seek.max = String(lastSeq);
    seek.value = String(lastSeq);
    seekLabel.textContent = "live";
  };
}

  const url = composeMode === "build" ? "/build"
    : composeMode === "task" ? "/task" : "/meeting";
  const askRaw = document.getElementById("spend").value;
  const ask_above = askRaw ? Number(askRaw) : null;

  const body = composeMode === "build" ? { prompt: brief, project, ask_above }
    : composeMode === "task" ? { role: picked[0], brief, project }
    : { kind: "arbitration", participants: picked, topic: brief, project, ask_above };

  sent.textContent = "sending";
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    sent.textContent = res.ok
      ? (composeMode === "build" ? "the director is planning it"
        : composeMode === "meeting" ? "convening the room" : "queued on the floor")
      : await res.text();
    if (res.ok) briefBox.value = "";
  } catch (err) {
    sent.textContent = "the daemon is not accepting work";
  }
};

const seek = document.getElementById("seek");
const seekLabel = document.querySelector("#scrub .lbl");
seek.addEventListener("input", () => {
  scrubbing = Number(seek.value) < lastSeq;
  seekLabel.textContent = scrubbing ? "seq " + seek.value : "live";
  rebuildTo(Number(seek.value));
});
document.getElementById("tolive").onclick = () => {
  scrubbing = false;
  seek.value = String(lastSeq);
  seekLabel.textContent = "live";
  rebuildTo(lastSeq);
};

fetch("/floor").then((r) => r.json()).then((f) => {
  miniFloor = f;
  fitShadowToFloor(f);
  const built = buildOffice(f, scene);
  avatars = built.avatars;
  ambient = built.ambient || [];
  meetingTable = built.meetingTable;
  rebuildHitList();
  resize();
  refreshScreens(screenData());
  paintScreens(Infinity);
  renderMinimap();
  miniDirty = false;
  setStage({
    THREE, renderer, scene, camera, orbit, avatars, ambient, world: built.world,
    deskState, showDetail, updateCamera,
    now: () => clock.getElapsedTime(),
    focused: () => following,
    follow: (role) => { following = role; showDetail(role); },
  });
  startChatter();
  animate();
  connect();
});
</script>
<script type="module" src="/panels.js"></script>
</body>
